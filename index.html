<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="qiling - 个人博客，分享项目、技术与生活">
  <meta name="theme-color" content="#0a0a0f">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://images.unsplash.com">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <title>qiling - Personal Site</title>
</head>
<body>

  <!-- Loading Screen -->
  <div class="loading-screen">
    <div class="loading-logo">D</div>
    <div class="loading-text">Loading...</div>
  </div>

  <!-- Snow Mountain Background -->
  <div class="hero-bg">
    <div class="layer layer-1"></div>
    <div class="layer layer-2"></div>
    <div class="layer layer-3"></div>
  </div>
  <div class="hero-orbs">
    <span class="hero-orb hero-orb-1"></span>
    <span class="hero-orb hero-orb-2"></span>
    <span class="hero-orb hero-orb-3"></span>
  </div>
  <div class="hero-overlay"></div>
  <div class="snow-particles"></div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo">
        <span class="nav-logo-dot"></span>
        qiling
      </a>
      <div class="nav-links">
        <a class="nav-link active" data-target="hero">首页</a>
        <a class="nav-link" data-target="projects">项目</a>
        <a class="nav-link" data-target="blog">博客</a>
        <a class="nav-link" data-target="about">关于</a>
      </div>
      <button class="nav-toggle" aria-label="菜单">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="hero" class="hero">
    <div class="hero-content">
      <!-- Avatar -->
      <div class="hero-avatar" id="hero-avatar">
        <div class="hero-avatar-inner" id="hero-avatar-inner">D</div>
        <div class="hero-avatar-badge">
          <i class="fas fa-camera" style="font-size:0.6rem;"></i>
        </div>
      </div>

      <!-- Name & Titles -->
      <h1 class="hero-title" id="hero-name">qiling</h1>
      <p class="hero-subtitle" id="hero-subtitle">专注 / 创新 / 适应</p>
      <p class="hero-bio" id="hero-bio">
        欢迎来到我的记录博客
      </p>
      <div class="hero-pills">
        <span class="hero-pill">项目作品</span>
        <span class="hero-pill">日常记录</span>
        <span class="hero-pill">持续更新</span>
      </div>

      <!-- Social Links -->
      <div class="hero-social" id="hero-social">
        <a href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="mailto:11433282920@qq.com" aria-label="Email">
          <i class="fas fa-envelope"></i>
        </a>
      </div>
    </div>

    <div class="scroll-indicator">
      <span>向下滚动</span>
      <div class="scroll-indicator-line"></div>
    </div>
  </section>

  <!-- Section Divider -->
  <div class="section-divider">
    <div class="section-divider-line"></div>
  </div>

  <!-- Projects Section -->
  <section id="projects" class="section">
    <div class="section-header animate-on-scroll">
      <div class="section-label">Projects</div>
      <h2 class="section-title">我的项目</h2>
      <p class="section-desc">一些我参与开发和独立完成的项目</p>
    </div>
    <div id="projects-grid" class="projects-grid"></div>
  </section>

  <!-- Section Divider -->
  <div class="section-divider">
    <div class="section-divider-line"></div>
  </div>

  <!-- Blog Section -->
  <section id="blog" class="section">
    <div class="section-header animate-on-scroll">
      <div class="section-label">Blog</div>
      <h2 class="section-title">日常</h2>
      <p class="section-desc">技术分享、学习笔记、生活记录</p>
    </div>
    <div id="blog-grid" class="blog-grid"></div>
  </section>

  <!-- Section Divider -->
  <div class="section-divider">
    <div class="section-divider-line"></div>
  </div>

  <!-- About Section -->
  <section id="about" class="section">
    <div class="section-header animate-on-scroll">
      <div class="section-label">About</div>
      <h2 class="section-title">关于我</h2>
    </div>
    <div class="about-content animate-on-scroll">
      <p class="about-text" id="hero-bio-about">
        我是一个热爱探索的攀登者，探索新运动，探索新技术，探索新人生，做自己的独一档。
        我，专注探索，无限进步。
      </p>
      <div class="about-stats">
        <div class="about-stat">
          <div class="about-stat-number">∞</div>
          <div class="about-stat-label">热爱探索</div>
        </div>
      </div>
      <div class="about-note">
        这里会持续更新我的项目、日常与阶段性成长记录。
      </div>
    </div>
  </section>

  <!-- Section Divider -->
  <div class="section-divider">
    <div class="section-divider-line"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="#" data-target="hero">首页</a>
        <a href="#" data-target="projects">项目</a>
        <a href="#" data-target="blog">博客</a>
        <a href="#" data-target="about">关于</a>
      </div>
      <div class="footer-copyright">
        &copy; 2024-2026 qiling. Built with ❤️
      </div>
    </div>
  </footer>

  <!-- Blog Post Modal -->
  <div id="blog-modal" class="blog-modal">
    <div class="blog-modal-overlay"></div>
    <div class="blog-modal-content">
      <button class="blog-modal-close" aria-label="关闭">
        <i class="fas fa-times"></i>
      </button>
      <h2 id="modal-title"></h2>
      <div id="modal-tags" class="project-tags" style="margin-bottom:var(--space-sm);"></div>
      <div class="blog-card-date" id="modal-date"></div>
      <div id="modal-body" class="blog-modal-body"></div>
    </div>
  </div>

  <!-- Back to Top -->
  <button class="back-to-top" aria-label="回到顶部">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script src="js/site-content.js"></script>

  <!-- Scripts -->
  <script src="js/main.js"></script>
</body>
</html>
